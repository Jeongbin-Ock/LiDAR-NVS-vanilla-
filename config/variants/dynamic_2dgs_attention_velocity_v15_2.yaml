# Bbox-free Dynamic 2DGS V15.2.
#
# V15 with two changes to its Gaussian count; every other key is V15's
# (config/variants/dynamic_2dgs_attention_velocity_v15.yaml): the post-activation
# Utonia stem adapter, v_raw without weight decay, no temporal LayerScale, the
# 0.8 m radius local-attention block and the 432 -> 256 -> 128 -> 3 router with
# hard Gumbel-softmax (tau 1, no annealing).
#
#   1. Per-option experts instead of nested prefixes (count_mode: expert_gumbel).
#      LN(f) -> Linear(432 -> 576) -> SiLU is one shared trunk, and three linear
#      experts read it: E1 (576 -> 42), E3 (576 -> 126) and E5 (576 -> 210), so
#      the second layer predicts 1 + 3 + 5 Gaussians. reduce / keep / add
#      render E1 / E3 / E5, and every Gaussian of the chosen expert carries that
#      option's straight-through opacity gate, so every token -- reduce
#      included -- sends its router a gradient. In V15 a reducing token renders
#      only G1, which no gate touches.
#   2. The second training render is every token's E5 (auxiliary_render:
#      dense_add) instead of every token's G1..G3, at 2 target views per window
#      drawn uniformly at random each step (auxiliary_views: 2) instead of all
#      of them. Training optimizes the mean of the routed and the E5 render
#      losses; evaluation renders the routed set only.
#
# The E5 path (LN -> 432 -> 576 -> SiLU -> 210) is V15's whole decoder and
# V15.3's head, so V15.3 isolates the router and the E1/E3 experts.
model:
  variant: dynamic_2dgs_attention_velocity_v15_2

exp_name: ${model.variant}-bs-${train.batch_size}

p2g:
  freeze_utonia: true
  utonia_feature_stage: 3
  head_offset_bound: 0.4
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  utonia_adaptation:
    mode: hybrid
    lora_targets: [attention, cpe, pooling]
    train_layer_norm: true
    stem:
      train_intensity_column: true
      adapter_position: post_activation
      adapter_hidden: 16
      adapter_activation: gelu
      adapter_scale: 1.0
    ffn_adapter:
      widths: [8, 16, 32, 64]
      activation: relu
      scale: 0.1
      dropout: 0.0
  grid_query:
    count_mode: expert_gumbel
    expert_count:
      option_counts: [1, 3, 5]
      seed_mode: token
      tau: 1.0
      decoder_hidden: 576
      router_hidden: [256, 128]
      auxiliary_render: dense_add
      # The E5 render uses 2 of each window's target views, drawn uniformly
      # from all of them (inputs and novel sweeps) every step.
      auxiliary_views: 2
      logging:
        enable: true
        interval: 20
        range_edges_m: [0, 10, 20, 30, 40, 60, 80, 110]

train:
  # One learning rate for the whole model: since 2026-10-08 every Utonia role
  # follows train.lr (previously 1e-3 intensity/adapter, 5e-5 LoRA/LayerNorm).
  # Each role keeps its weight decay; earlier checkpoints resume with the rates
  # embedded in their config.
  utonia_param_groups:
    intensity:
      lr: ${train.lr}
      weight_decay: 1.0e-4
    adapter:
      lr: ${train.lr}
      weight_decay: 1.0e-4
      bias_weight_decay: 0.0
    lora:
      lr: ${train.lr}
      weight_decay: 1.0e-4
    layer_norm:
      lr: ${train.lr}
      weight_decay: 0.0
  # Names relative to Point2Gaus. These parameters train at train.lr with no
  # weight decay, in a last `downstream_no_decay` group.
  downstream_no_decay: [dynamic_backend.temporal.v_raw]
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

# Default training data: config/data/nuscenes_dynamic.yaml, the random-duration
# loader with the two LiDAR4D scenes held out. data_config=<name> picks another.
data_config: nuscenes_dynamic

dynamic_2dgs:
  temporal:
    implementation: flash_varlen
    layers: 12
    num_heads: 12
    mlp_ratio: 4

    use_time_embedding: true
    time_embedding_dim: 64
    time_frequencies: 8
    time_reference_sec: 1.0

    position_encoding: barrier_rope_split

    # V14.1's linear hinge at the learned global speed:
    #   bias_ij = -relu(d_ij / (softplus(v_raw) * |dt|) - 1).
    # This 30 m/s value initializes v_raw; after construction the active speed
    # comes from the parameter, not from the config value.
    barrier_speed_mps: 30.0
    barrier_weight: 1.0
    barrier_exponent: 1
    match_chunk_size: 4096

    # Heads 1-11 only. 2*pi/scale = 5 m for the highest-frequency 3D RoPE band.
    rope_base: 100.0
    rope_position_scale: 1.2566370614359172

    qk_norm: true
    # No LayerScale: every layer adds out_proj(attended) to the residual stream
    # as is. layer_scale_init would have nothing to initialize, so it is absent.
    layer_scale: false

  # One pre-LN block after the temporal stack: x + Attn(LN(x)), then
  # + FFN(LN(.)) with a SiLU FFN whose last layer starts at zero. Every token
  # attends to all tokens of both sweeps within radius_m at their reference-frame
  # positions (itself included), without QK RMSNorm or LayerScale. 3D RoPE at
  # base 10^1.2 and 2*pi/0.4 rad/m gives six wavelengths per axis from 0.4 m (the
  # voxel) to 4.0 m; the longest half-wavelength, 2 m, exceeds the 0.8 m radius.
  # query_chunk_size is how many queries (one FlashAttention2 varlen sequence
  # each) go into one call; FlashAttention2 takes at most 65535.
  local_attention:
    radius_m: 0.8
    num_heads: 12
    mlp_ratio: 4
    rope_base: 15.848931924611133      # 10^1.2
    rope_position_scale: 15.707963267948966  # 2*pi/0.4 -> wavelengths 0.4-4.0 m
    implementation: flash_varlen
    query_chunk_size: 4096

  gaussian_head:
    initial_opacity: 0.2
    initial_scale_m: 0.3

  motion:
    zero_init: true
    residual_hidden_dim: 96
    velocity_embedding_dim: 32
    detach_init_condition: true

  regularization:
    velocity_l2:
      enabled: true
      mode: split_group_l2
      init_weight: 0.01
      offset_weight: 0.01
      warmup_steps: 0
      ramp_steps: 0

loss:
  w_chamfer: 0.02
