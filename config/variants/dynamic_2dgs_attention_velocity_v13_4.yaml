# Dynamic 2DGS V13.4: V13.3 without 3D RoPE on match head 0.
#
# Every configured value is identical to V13.3 except model.variant and
# temporal.position_encoding. All twelve heads keep per-layer Q/K RMSNorm.
# Head 0 uses RMS-normalized content logits directly, while heads 1-11 retain
# V13.3's metric 3D RoPE. They remain packed into one varlen FlashAttention
# call, and there is still no distance bias, barrier, or separate temperature.
model:
  variant: dynamic_2dgs_attention_velocity_v13_4

exp_name: ${model.variant}-bs-${train.batch_size}

p2g:
  freeze_utonia: true
  utonia_feature_stage: 3
  head_offset_bound: 0.4
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  grid_query:
    count_mode: learned_gumbel
    grad_balance: sqrt_k
    learned_count:
      K_max: 3
      tau: 1.0
      seed_mode: range_quantile
      grad_balance_scope: token
      logging:
        enable: true
        interval: 20
        range_edges_m: [0, 10, 20, 30, 40, 60, 80, 110]

# Default training data: config/data/nuscenes.yaml, the legacy fixed-window
# loader with the two LiDAR4D scenes held out. data_config=<name> picks another.
data_config: nuscenes

dynamic_2dgs:
  temporal:
    implementation: flash_varlen
    layers: 12
    num_heads: 12
    mlp_ratio: 4

    use_time_embedding: true
    time_embedding_dim: 64
    time_frequencies: 8
    time_reference_sec: 1.0

    position_encoding: rope_except_head0
    rope_base: 100.0
    rope_position_scale: 1.2566370614359172
    qk_norm: true
    layer_scale_init: 0.1

  gaussian_head:
    initial_opacity: 0.2
    initial_scale_m: 0.3

  motion:
    zero_init: true
    residual_hidden_dim: 96
    velocity_embedding_dim: 32
    detach_init_condition: true

  regularization:
    velocity_l2:
      enabled: true
      mode: split_group_l2
      init_weight: 0.01
      offset_weight: 0.01
      warmup_steps: 0
      ramp_steps: 0

loss:
  w_chamfer: 0.02
