# Dynamic 2DGS V13.2 with ordinary raw-QK attention on every head.
#
# V13.2 is V13 with only the motion-head score changed. Head 0 no longer uses
# L2 normalization or a separate temperature. All twelve heads use
#
#     score_ij = dot(RoPE(q_i), RoPE(k_j)) / sqrt(head_dim)
#
# with raw projected Q/K vectors. The all-head 3D RoPE/FlashAttention path,
# head-0 xyz readout, learned layer mixture, adaptive K={1,2,3} router,
# range-quantile seeds, embedded-init velocity offset, losses, data contract,
# and 0.4 m Gaussian offset bound are unchanged from V13.
model:
  variant: dynamic_2dgs_attention_velocity_v13_2

exp_name: ${model.variant}-bs-${train.batch_size}

p2g:
  freeze_utonia: true
  utonia_feature_stage: 3
  head_offset_bound: 0.4
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  # Identical to V13: adaptive K={1,2,3}, deterministic range-quantile
  # candidate rows, and no routing budget loss.
  grid_query:
    count_mode: learned_gumbel
    grad_balance: sqrt_k
    learned_count:
      K_max: 3
      tau: 1.0
      seed_mode: range_quantile
      grad_balance_scope: token
      logging:
        enable: true
        interval: 20
        range_edges_m: [0, 10, 20, 30, 40, 60, 80, 110]

# Default training data: config/data/nuscenes.yaml, the legacy fixed-window
# loader with the two LiDAR4D scenes held out. data_config=<name> picks another.
data_config: nuscenes

dynamic_2dgs:
  temporal:
    implementation: flash_varlen
    layers: 12
    num_heads: 12
    mlp_ratio: 4

    use_time_embedding: true
    time_embedding_dim: 64
    time_frequencies: 8
    time_reference_sec: 1.0

    position_encoding: rope_all_heads

    rope_base: 100.0
    rope_position_scale: 1.2566370614359172

    # No Q/K RMSNorm, no head-0 L2 norm, and no temperature parameter.
    qk_norm: false
    layer_scale_init: 0.1

  gaussian_head:
    initial_opacity: 0.2
    initial_scale_m: 0.3

  motion:
    zero_init: true
    residual_hidden_dim: 96
    velocity_embedding_dim: 32
    detach_init_condition: true

  regularization:
    velocity_l2:
      enabled: true
      mode: split_group_l2
      init_weight: 0.01
      offset_weight: 0.01
      warmup_steps: 0
      ramp_steps: 0

loss:
  w_chamfer: 0.02
