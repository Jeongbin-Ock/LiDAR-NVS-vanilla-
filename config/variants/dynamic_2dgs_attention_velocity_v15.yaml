# Bbox-free Dynamic 2DGS V15.
#
# V14.1 with five changes; everything not listed is V14.1's (the hybrid Utonia
# adaptation's role groups, the linear barrier at a learned global v_max, the
# offset head, the split velocity prior, the random-duration loader and the
# ego-frame coordinates).
#
#   1. Utonia stem: the adapter moves behind the activation. There is no
#      [x, y, z, I] adapter before the stem LayerNorm any more; the pre-norm stem
#      is frozen XYZ plus the zero-initialized intensity column w_I, and a
#      parallel residual adapter (54 -> 16 -> 54, GELU, zero-initialized `up`)
#      adds to h = GELU(LN(W x)), so the stem is still exactly the pretrained
#      one at init. 1,798 parameters replace V14's 998.
#   2. v_raw, the learned max speed, trains without weight decay: it leaves the
#      `downstream` group for a `downstream_no_decay` group at the same lr.
#   3. The temporal cross-attention has no LayerScale gate: the out_proj branch
#      is added to the residual stream as is, out_proj at its default init.
#   4. One radius local-attention block (0.8 m, both sweeps' tokens, 3D RoPE
#      wavelengths 0.4-4.0 m) runs after the temporal stack. v_offset still
#      reads the temporal stack's output, not the block's.
#   5. The Gaussian head decodes G1..G5 from the block's output around the one
#      token anchor (LN -> 432 -> 576 -> SiLU -> 210), and a 3-layer router
#      behind its own LayerNorm (432 -> 256 -> 128 -> 3) picks reduce / keep /
#      add = {G1} / {G1..G3} / {G1..G5} per token, with hard Gumbel-softmax
#      (tau 1, no annealing) in training and argmax at evaluation. Training
#      renders twice, the routed set and (auxiliary_render: dense_keep) every
#      token's G1..G3, and optimizes the mean of the two render losses;
#      evaluation renders the routed set only.
#
# The router is not V14.1's learned_gumbel K={1,2,3} one, so the count block
# below replaces V14.1's whole p2g.grid_query rather than editing it.
model:
  variant: dynamic_2dgs_attention_velocity_v15

exp_name: ${model.variant}-bs-${train.batch_size}

p2g:
  freeze_utonia: true
  utonia_feature_stage: 3
  head_offset_bound: 0.4
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  utonia_adaptation:
    mode: hybrid
    lora_targets: [attention, cpe, pooling]
    train_layer_norm: true
    stem:
      train_intensity_column: true
      adapter_position: post_activation
      adapter_hidden: 16
      adapter_activation: gelu
      adapter_scale: 1.0
    ffn_adapter:
      widths: [8, 16, 32, 64]
      activation: relu
      scale: 0.1
      dropout: 0.0
  grid_query:
    count_mode: nested_gumbel
    nested_count:
      option_counts: [1, 3, 5]
      seed_mode: token
      tau: 1.0
      decoder_hidden: 576
      router_hidden: [256, 128]
      auxiliary_render: dense_keep
      logging:
        enable: true
        interval: 20
        range_edges_m: [0, 10, 20, 30, 40, 60, 80, 110]

train:
  utonia_param_groups:
    intensity:
      lr: 1.0e-3
      weight_decay: 1.0e-4
    adapter:
      lr: 1.0e-3
      weight_decay: 1.0e-4
      bias_weight_decay: 0.0
    lora:
      lr: 5.0e-5
      weight_decay: 1.0e-4
    layer_norm:
      lr: 5.0e-5
      weight_decay: 0.0
  # Names relative to Point2Gaus. These parameters train at train.lr with no
  # weight decay, in a last `downstream_no_decay` group.
  downstream_no_decay: [dynamic_backend.temporal.v_raw]
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8

data:
  dataset_name: nuscenes_dynamic_lidar4d
  mode: nvs
  bbox_json_path: null
  train_excluded_scenes: null
  dynamic_window:
    endpoint_min_sec: 0.2
    endpoint_max_sec: 1.2
    eval_seed: 42
    # LiDAR4D test sequences seq_1600_1650 / seq_3180_3230 live inside these
    # train scenes. Hold out each complete scene to prevent overlap.
    train_excluded_scenes: [scene-0757, scene-1094]

dynamic_2dgs:
  temporal:
    implementation: flash_varlen
    layers: 12
    num_heads: 12
    mlp_ratio: 4

    use_time_embedding: true
    time_embedding_dim: 64
    time_frequencies: 8
    time_reference_sec: 1.0

    position_encoding: barrier_rope_split

    # V14.1's linear hinge at the learned global speed:
    #   bias_ij = -relu(d_ij / (softplus(v_raw) * |dt|) - 1).
    # This 30 m/s value initializes v_raw; after construction the active speed
    # comes from the parameter, not from the config value.
    barrier_speed_mps: 30.0
    barrier_weight: 1.0
    barrier_exponent: 1
    match_chunk_size: 4096

    # Heads 1-11 only. 2*pi/scale = 5 m for the highest-frequency 3D RoPE band.
    rope_base: 100.0
    rope_position_scale: 1.2566370614359172

    qk_norm: true
    # No LayerScale: every layer adds out_proj(attended) to the residual stream
    # as is. layer_scale_init would have nothing to initialize, so it is absent.
    layer_scale: false

  # One pre-LN block after the temporal stack: x + Attn(LN(x)), then
  # + FFN(LN(.)) with a SiLU FFN whose last layer starts at zero. Every token
  # attends to all tokens of both sweeps within radius_m at their reference-frame
  # positions (itself included), without QK RMSNorm or LayerScale. 3D RoPE at
  # base 10^1.2 and 2*pi/0.4 rad/m gives six wavelengths per axis from 0.4 m (the
  # voxel) to 4.0 m; the longest half-wavelength, 2 m, exceeds the 0.8 m radius.
  # query_chunk_size is how many queries (one FlashAttention2 varlen sequence
  # each) go into one call; FlashAttention2 takes at most 65535.
  local_attention:
    radius_m: 0.8
    num_heads: 12
    mlp_ratio: 4
    rope_base: 15.848931924611133      # 10^1.2
    rope_position_scale: 15.707963267948966  # 2*pi/0.4 -> wavelengths 0.4-4.0 m
    implementation: flash_varlen
    query_chunk_size: 4096

  gaussian_head:
    initial_opacity: 0.2
    initial_scale_m: 0.3

  motion:
    zero_init: true
    residual_hidden_dim: 96
    velocity_embedding_dim: 32
    detach_init_condition: true

  regularization:
    velocity_l2:
      enabled: true
      mode: split_group_l2
      init_weight: 0.01
      offset_weight: 0.01
      warmup_steps: 0
      ramp_steps: 0

loss:
  w_chamfer: 0.02
