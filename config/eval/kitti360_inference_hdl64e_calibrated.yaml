# KITTI-360 HDL-64E GT built from the unit's own laser geometry.
# Rows are the 64 lasers (identified per return from the fitted per-laser cones),
# row angles are the fitted beam elevations, and the upper/lower emitter blocks
# are rendered from their own origins on the sensor z axis (+0.2035 / +0.1209 m).
# Columns give each firing its own slot (column_assignment: firing_slot | nearest).
# See src/dataloader/kitti360/hdl64e.py and config/eval/kitti360_inference.md.
mode: test
seed: 42
device:
- 1
out_dir: null
depth_statistic: median
data:
  dataset_name: kitti360_lidar4d
  dataroot: /data1/kitti360
  version: KITTI-360
  test_split: test
  coordinate_frame: ego_vehicle
  mode: nvs
  bbox_json_path: null
  train_excluded_scenes: null
  image_height: 64
  image_width: 2178
  # Used for renderer culling only; GT rows come from the laser table.
  vfov:
  - -24.9
  - 2.0
  hfov:
  - -180.0
  - 180.0
  ring_to_elevation_deg: null
  ego_radius: 2.5
  gt_ego_radius: 2.5
  max_depth_m: 80.0
  sequence: 2013_05_28_drive_0000_sync
  benchmark_scenes:
  - 1538
  - 1728
  - 1908
  - 3353
  - 2350
  - 4950
  - 8120
  - 10200
  - 10750
  - 11400
  pose_missing_policy: interpolate  # time-weighted translation + SLERP between direct poses
  compact_val:
    enable: false
  verbose: true
  panorama_projection: hdl64e_kitti360_calibrated
  column_assignment: firing_slot
test:
  batch_size: 1
  ckpt_path: null
  input_offsets_sec:
  - -0.5
  - 0.5
  velocity_source: total
  shuffle_orders: false
