# Waymo Perception v2.0.1 TOP LiDAR, calibrated 64x1024 target panorama.
data:
  dataset_name: waymo_dynamic
  dataroot: /data/waymo/waymo_v2_cache
  raw_dataroot: /data/waymo/waymo_v2
  allow_raw_fallback: true
  version: waymo_perception_v2_0_1
  train_split: train
  eval_split: val
  test_split: val
  coordinate_frame: ego_vehicle
  mode: nvs
  expected_train_sequences: 798
  expected_val_sequences: 202
  window_stride_sec: 0.5
  max_sweep_gap_sec: 0.15
  gt_middle_count: 3
  dynamic_window:
    endpoint_min_sec: 0.2
    endpoint_max_sec: 1.0
    eval_seed: 42
  image_height: 64
  image_width: 1024
  vfov: [-17.6, 2.4]
  hfov: [-180.0, 180.0]
  intensity_max: 1.0
  ego_radius: 2.5
  gt_ego_radius: 0.0
  max_depth_m: 80.0
  max_val_windows: 200
  num_workers: 4
  eval_num_workers: 0
  compact_val:
    enable: false
  verbose: true
