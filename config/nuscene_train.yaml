device: [8, 9]
seed: 42

model:
  # Fresh runs default to the current Dynamic 2DGS baseline.
  variant: dynamic_2dgs_attention_velocity_v11_4

project_name: 2dgs-utonia
exp_name: ${model.variant}-bs-${train.batch_size}
mode: train
allow_legacy_wandb_fallback: false


loss:
  w_chamfer: 0.02 #0.02
  w_depth: 0.5          # depth supervision = 0.5 * mean-depth L1
  w_depth_median: 0.5   #                   + 0.5 * median-depth L1
  w_intensity: 0.2
  w_raydrop: 0.5
  w_scale: 0.0           # scale loss는 계산/기록하지만 0.0이면 total에는 반영하지 않음
  scale_max_m: 2.5       # softplus scale regularization threshold
  enable_lpips: false

metrics:
  interval: 50           # train valid/raydrop + val/test *_valid 진단 metric 계산 주기

train:
  lr: 5e-4
  warmup_iters: 500           # linear warmup over this many optimizer steps
  weight_decay: 1e-4
  grad_clip: 1.0
  max_epochs: 40
  batch_size: 1
  val_check_interval: 1.0
  max_steps: 1000000
  ckpt_path: null   # train from scratch (scheduler + grad clipping stability fix)
  grad_accum_steps: 4
test:
  batch_size: 1
  ckpt_path: null

data:
  dataset_name: "nuscenes"
  dataroot: "/data1/nuScenes"
  version: "v1.0-trainval"
  test_version: "v1.0-test"
  train_split: "train"
  eval_split: "val"
  test_split: "test"
  window_us: 1000000       # 1.0s window: 0.0s ... 1.0s
  sample_gap_us: 100000    # choose every 0.1s from 0.05s sweeps
  gt_middle_count: 3       # loss GT = 2 endpoint inputs + 3 middle sweeps
  pair_mode: "keyframe"    # "sweep" | "keyframe". keyframe: both inputs are
                           # exact-time keyframes pair_kf_stride apart (no box
                           # staleness); GT = 0.1s sweeps between them.
  pair_kf_stride: 2        # keyframe gap for window endpoints (2 ~= 1.0s)
  mode: "bbox"          # "nvs" | "bbox" (Phase A=nvs; Phase B switches to bbox)
  bbox_json_path: "/data1/nuScenes/bbox/tracking_{split}.json"
  num_workers: 4
  eval_num_workers: 0
  # Per-epoch validation over the full val split is ~5.7k heavily-overlapping
  # windows, and the metric is dominated by geometry the velocity head cannot
  # change. compact_val swaps in a fixed 200-window subset weighted toward
  # motion: 180 dynamic (GT-bbox labelled, stratified over four difficulty
  # tiers) + 20 static held back as a no-motion control. Built by
  # tools/build_compact_val_windows.py; the manifest records the sampling
  # contract it was built under and refuses to load against another.
  compact_val:
    enable: true
    path: config/compact_val_windows.json
  verbose: false
  vfov: [-30.67, 10.67] 
  hfov: [-180, 180]  
  image_height: 32
  image_width: 1085
  ring_to_elevation_deg: ${p2g.ring_to_elevation_deg}
  ego_radius: ${p2g.ego_radius}


logger:
  enable: true
  name: wandb
  dir: logs/${exp_name}
  system_metrics: false  # W&B System 탭의 CPU/GPU/RAM 시계열을 기록하지 않음
  wandb_run_id: null  # 기존 W&B run id를 넣으면 새 run 대신 그 run에 이어서 기록 (resume="must")





p2g:
  # Backbone
  freeze_utonia: true   # pretrained base/norm frozen; active LoRA만 trainable
  utonia_ckpt: null   # optional abs path override; null -> checkpoints/utonia/utonia.pth (config dump: config/utonia_pretrained.yaml)
  utonia_feature_stage: 3  # encoder stage index: 3 -> 0.4m/432D, 4 -> 0.8m/576D (default/final)
  # Checkpoint의 functional XYZ 입력([xyz, zero_rgb, zero_normal])을 XYZI로
  # 바꾸고 Utonia의 모든 Linear/SubMConv3d에 LoRA를 설치한다. 실제 forward가
  # 지나는 stage까지만 trainable로 두어 DDP unused parameter를 피한다. 출력은
  # 바로 temporal attention으로 간다 (LoRA는 필수).
  utonia_lora:
    enable: true
    input_mode: xyzi
    rank: 16
    alpha: 16
    dropout: 0.0
  head_offset_bound: 0.4    # gaussian pos = seed_pos + bound*tanh(offset), per-axis meters

  gs_params:               # source of truth for the gaussian head size (= sum)
    opacity: 1
    scaling: 2
    rotation: 4
    shs: 32                # 16 intensity SH + 16 raydrop SH
    offset: 3              # position-offset head: 3 enables bounded xyz offset
  # LiDAR geometry. Raster image size comes from data.image_height/width via the
  # Camera object, not from here.
  ring_to_elevation_deg: [
    -30.67, -29.33, -28.00, -26.66, -25.33, -24.00, -22.67, -21.33,
    -20.00, -18.67, -17.33, -16.00, -14.67, -13.33, -12.00, -10.67,
     -9.33,  -8.00,  -6.66,  -5.33,  -4.00,  -2.67,  -1.33,   0.00,
      1.33,   2.67,   4.00,   5.33,   6.67,   8.00,   9.33,  10.67,
  ]

  # Preprocessing
  ego_radius: 2.5

g2g: {}                   # DynamicGausTemp takes no config; block kept so cfg.g2g resolves
g2p:
  neg_fov: true
  sh_degree: 3
  scale_factor: 1.0
  dynamic: false
